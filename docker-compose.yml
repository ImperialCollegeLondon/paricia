services:
  db:
    image: timescale/timescaledb-ha:pg14-latest
    volumes:
      - db:/home/postgres/pgdata/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432
  web:
    build: .
    environment:
      - LOGGING_FILE=/usr/src/app/log/paricia
    volumes:
      - .:/usr/src/app
      - static:/usr/src/app/staticfiles
      - media:/usr/src/app/data/media
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - static:/usr/src/app/staticfiles
      - media:/usr/src/app/data/media
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    depends_on:
      - web

volumes:
  db:
  static:
  media:
  caddy_data:
  caddy_config:
